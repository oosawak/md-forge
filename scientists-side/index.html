<script type="text/markdown" data-file="scenario.md">
# scenario.md — SCIENTISTS 設定とイベント

md-forge Horror エンジン（scientists/ 版）用のシナリオです。潜入からエンディング（5 種）まで。

## 設定

| 項目 | 値 |
| --- | --- |
| タイトル | SCIENTISTS |
| 説明 | エデン生命科学研究所に潜入し、研究を止めて脱出する。エンディングは 5 種類。 |
| 開始部屋 | entrance |
| 開始イベント | opening |
| 最初の灯 | 3 |
| 灯の最大 | 5 |
| 持ち物の上限 | 4 |
| キャッチ | 生命の価値を決めるのは、誰なのか。 |
| 入室の猶予 | 2 |
| 最初の目的 | 研究所の証拠（研究資料）を集める |

## 書き方（scientists/ 版で増えた命令）

> - `[数値 名前 +1]` `[数値 名前 -1]` `[数値 名前 =0]`：カウンタ。条件は `数値:名前>=3`。セリフの中で `{数値:名前}` と書くと値が入る。
> - `[解放 名前]`：エリアを解放する。条件は `解放:名前`。
> - `[入力 答え → イベント]`：文字を入力させる。答えは `|` で区切って複数書ける。ひらがな・カタカナ・全角半角・大文字小文字の違いは区別しない。外れたら次の行へ進む。
> - `[取得 物]`：消耗品（items.md の「使う」がある物）は「持ち物の上限」まで。いっぱいのときは `## イベント 満杯` へ移る。
> - `[目的 文]`：画面上部の「目的：」を書き換える（`{数値:名前}` も使える）。最初の目的は設定「最初の目的」。
> - `[暗く]` `[明るく]`：画面を黒くしたまま文を出す／元に戻す（導入や場面転換用）。
> - 設定「キャッチ」はタイトルの下の一文、「入室の猶予」は部屋に入ってから実験体に見つからない秒数。
> - `[追跡 名前 秒数 → イベント]`：灯が尽きたらゲームオーバーではなく、そのイベントへ移る。
> - 条件 `部屋:ID`：今いる部屋。items.md の使う欄 `イベント:名前` で、使ったときにイベントを動かせる。
> - カウンタ：資料（回収した研究資料）・真相（ノワとリヒトの真相に関わる資料）・救った・安楽死・見送った

## 書き方（横スクロール版 scientists-side で増えた命令と見方）

> - 部屋の描き方・見た目の一覧は map.md の冒頭。コードブロックは 2 行（壁の列・床の列）。
> - `[変化 記号 見た目]`：今の部屋のその物の見た目を変える。`[変化 部屋ID:記号 見た目]` で別の部屋の物も。見た目を書かないと元に戻る。
> - `[文字 文]`：壁に赤い文字が浮かぶ。`[落書き 記号 文]`：壁に文字を残す。`[手 記号]`：その物から手が伸びる（近くにいると灯が 1 つ消える）。
> - `[振り向く]` `[向き 左]` `[向き 右]`：主人公の向き。
> - 操作：←→ で歩く。扉・階段の前で ↑ か「調べる」。同じ列に壁の物と床の物があるときは、「調べる」は床の物、↑ は壁の物。ロッカーなど「隠れる」の前で調べると隠れ、左右に動くと出る。

## イベント 満杯

これ以上は持てない。何かを使ってから、もう一度調べよう。

## イベント opening

[暗く]
郊外の丘の上に、二十年前に廃校になった中学校がある。
窓は割れ、校庭は草に埋もれ、近所の子どもたちは「出る」と噂する。
だが、その地下と旧校舎には、今も明かりが灯っている。
——エデン生命科学研究所。
「生命は、科学によって自由に設計し、作り変えられるものである」
そう信じる者たちが、ここで命を作り、延ばし、混ぜ合わせている。
[待つ 0.6]
{主人公}「わたしはノワ。組織の壊滅のために送り込まれたスパイ」
{主人公}「任務は二つ。研究所の中で行われていることの証拠——研究資料を集めること。そして、研究を止めること」
{主人公}「戦う力はない。実験体に見つかったら、隠れるか、逃げるだけ」
> 操作の案内（黒い画面のまま出す）
【操作】移動：←→ キー・AD・ドラッグ（スマホは左下のスティック）
【操作】調べる・会話を進める：スペース・クリック・タップ（スマホは「調べる」）。扉や階段、壁の物は ↑ でも調べられる。
【操作】持ち物：I キー・「持ち物」ボタン。右上のろうそくが体力。実験体に触れると消える。
[明るく]
深夜。非常灯だけが、旧校舎の玄関ホールを照らしている。
{主人公}「……潜入、成功」
ふいに、頭の奥が痛んだ。この玄関を、知っている気がする。
{主人公}「……気のせい。まずは、このあたりを調べよう」
[目的 玄関ホールを調べてから、奥の扉の先（中央棟）へ進む]

## イベント shoebox

[済 → shoebox_after]
古い下駄箱。ひとつだけ、新しい南京錠がかかっていない棚がある。
[取得 懐中電灯]
{主人公}「誰かが置いていった……？　まるで、わたしが来るのを知っていたみたい」

## イベント shoebox_after

上履きが並んでいる。名札はどれも削り取られている。

## イベント shoebox2

ほこりをかぶった上履き。小さなサイズだ。

## イベント board

掲示板に、古い時間割が貼られたままになっている。
その上に、新しい紙が一枚。
「研究棟A（生命延長）は、旧理科室棟。合言葉は主任のみ管理」

## イベント reception

[済 → reception_after]
受付の窓口。引き出しの奥に、薬の小瓶がある。
[取得 薬]

## イベント reception_after

受付の窓口。来客名簿は白紙だ。

## イベント exit_locked

正面の扉。外から板が打ちつけられていて、内側からは開かない。
{主人公}「出口は、別に探すしかない」

## イベント 入室:central

[分岐 フラグ:研究棟A_クリア & !済:phase1_end → phase1_end]
[済 → central_after]
旧校舎の一階廊下。教室の札はそのままに、扉だけが電子錠に替えられている。
{主人公}「左の端が職員室、右の端の渡り廊下が研究棟A……」
{主人公}「研究棟Aの扉は、電子錠で閉じているはず。職員室に手がかりがあるかもしれない」
[目的 職員室（廊下の左端）で、研究棟Aに入る手がかりを探す]

## イベント central_after

> 2 回目以降は何もしない。

## イベント labB_locked

「研究棟B　遺伝子改良」の札。電子錠は赤く光っている。
{主人公}「カードキーが要る。研究棟Aの主任なら、持っているかもしれない」

## イベント labC_locked

「研究棟C　キメラ・軍事転用」の札。扉の向こうから、何かが這う音がする。
{主人公}「研究棟Bの主任のカードキーが要るみたい」

## イベント holding_locked

地下へ降りる階段。シャッターに、研究棟Cのカードリーダーがついている。

## イベント diary

[済 → diary_after]
研究員の日誌だ。
「生命延長計画は、最初の被験者から始まった。彼女は『トワ』と呼ばれた。永遠に生きるはずの子だった」
「主任は、あの子の名前を研究棟Aの合言葉にした。悪趣味だと思う」
「資料の原本は、本棚の奥の旧資料室に移した。あそこは誰も使わない」
[数値 資料 +1]
資料を手に入れた。（回収した資料 {数値:資料}）
[目的 研究棟A前室（中央棟の右端）の電子錠に、合言葉を入れる]

## イベント diary_after

「トワ」「本棚の奥の旧資料室」——日誌の言葉を思い出す。

## イベント shelf

[分岐 フラグ:本棚を押した → shelf_after]
[分岐 !済:diary → shelf_plain]
日誌の言葉を思い出して、本棚の奥を押してみる。
ガコン、と重い音がして、壁の一部がずれた。
[フラグ 本棚を押した]
[揺れ]
{主人公}「隠し通路……」

## イベント shelf_plain

古い教育書が並んでいる。一冊だけ、奥に押し込まれたままの本がある。

## イベント shelf_after

本棚の横に、細い通路が口を開けている。

## イベント blackboard

黒板に、消し残しの文字がある。
「延命は救済か？　——生命の価値を決めるのは、誰なのか」

## イベント desk

## イベント sink

[済 → sink_after]
流しに、空き瓶が転がっている。投げれば音で気をそらせそうだ。
[取得 空き瓶]

## イベント sink_after

流しの蛇口から、水が一滴ずつ落ちている。

## イベント 入室:archive

[済 → archive_after]
ほこりの匂い。誰にも忘れられた部屋だ。

## イベント archive_after

> 2 回目以降は何もしない。

- 壁：`絵`（肖像。`絵:目` 目が主人公を追う・`絵:泣く`・`絵:笑う`・`絵:無い` 人物が抜け出た）・`写真`（家族写真。`写真:目`・`写真:欠け` まん中が消えた・`写真:空き` 一人分の空白）・`額縁`（空の額）・`風景`（`風景:赤`）・`張り紙`（`張り紙:白`・`張り紙:血`）・`スイッチ`（`スイッチ:入`）・`覗き穴`（`覗き穴:目`）・`窓`（`窓:手` 手形・`窓:顔`・`窓:白`）・`時計`（`時計:逆` 針が逆に回る）・`鏡`（近づくと自分が映る。`鏡:影`）・`ランプ`（`ランプ:赤`・`ランプ:消`）
- 扉・階段：`扉`（`扉:鉄`・`扉:開`）・`階段:上`・`階段:下`。種類が `調べる` でも見た目を `扉` にすると扉の絵になる（玄関など、イベントで扱いたい扉）
- 床：`カウンター`・`机`・`長椅子`・`椅子`・`棚`・`カーテン`／`暗幕`・`ロッカー`（隠れると、中から扉のすき間ごしに外を見る画面になる。`ロッカー:開` 半開き）・`カメラ`・`台`・`花台`・`箱`

scientists-side で足した見た目（研究所用）：

- 壁：`モニター`（心拍の波形。`モニター:消`）・`金庫`・`黒板`・`窓口`（受付の小窓）・`パネル`（テンキーの操作盤。`パネル:開` で表示が緑）・`非常灯`（緑の誘導灯。光と組み合わせる）
- 扉：`扉:カード`（横にカードリーダー）・`扉:テンキー`（横にテンキー）。どちらも条件が合うとランプが緑になる。`扉:門`（格子の門）
- 床：`槽`（液体の円筒の槽。`槽:空`）・`檻`（`檻:壊れ`）・`ベッド`・`制御盤`・`下駄箱`・`消毒装置`（`消毒装置:動`）・`瓦礫`・`本棚`・`植木`・`流し`・`人:名前`（characters.md のその人をその場に描く）
- `机`・`台`・`ロッカー` に「絵」も書くと、上に小さく絵を置く（机の上の日誌など）

元の scientists/map.md からの変更：部屋 ID・扉の記号と行き先・条件・だめなとき・敵の出る条件・調べる対象のイベント名は同じです。位置は横 1 列に並べ直しました（扉の左右は部屋の端、奥の扉は壁の途中）。ロッカーは labA_ward・labB_hall・labC_room にあり、横スクロールでは敵をやり過ごすのに隠れる所が要るので、labA_ward のロッカーを 4 つに、labB_hall に「檻の陰」（隠れる）を 2 つ、holding にロッカーを 2 つ足しました。見回りの実験体が隠れ場所の前を通り過ぎるよう、隠れ場所は見回りの範囲（持ち場の左右 5 マス）の内側、端から 2 マス以上内に置いています。

      const kind = a.sk['種類'], L = num(a.sk['長さ'], 3);
      if (kind === '前') { const along = (G.x - a.ox) * a.dir; if (along > -0.3 && along < L) hurt(); }
      else if (kind === '円') { if (Math.abs(G.x - a.ox) < L + 0.2) hurt(); }
      else if (kind === '弾') { const n = Math.max(1, Math.round(L)); for (let i = 0; i < n; i++) { const sp2 = 3 + i * 1.3; RT.shots.push({ x: a.ox, vx: a.dir * sp2, life: 6 / sp2 }); } }   // 弾は 6 マスまで
      RT.flash = Math.max(RT.flash, kind === '弾' ? 0 : 0.15);
      g.cd = num(a.sk['間隔'], 1.6); g.act = null; RT.warns = [];
    }
  }
  if (RT.chase && !g.act && dist < 0.35 + size * 0.2) hurt();   // 技を構えている間は、体に触れても平気（すり抜けられる）
}

const ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
let VW = 0, VH = 0, TS = 64, DPR = 1, FLOOR_Y = 0, PSX = 0;
const ACT = 2.1;   // 人物の大きさ（1 マスに対する倍率）
function resize() {
  const r = $('#stage').getBoundingClientRect();
  DPR = Math.min(2, devicePixelRatio || 1); VW = r.width; VH = r.height;
  cv.width = dark.width = VW * DPR; cv.height = dark.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  TS = Math.max(40, Math.min(104, Math.floor(Math.min((VH - 40) / 4.4, VW / 7))));
  const lift = document.body.classList.contains('touch') ? TS * 0.7 : TS * 0.35;   // 会話欄やスティックに隠れないよう、少し上に寄せる
  FLOOR_Y = Math.max(10, (VH - TS * 4.1) / 2 - lift) + TS * 3.1;
}
addEventListener('resize', resize);
// 返すのは [部屋の左端の画面 x, 床の画面 y]
function cam() {
  const rm = room(), ww = rm.w * TS;
  const cx = ww <= VW ? (VW - ww) / 2 : Math.min(0, Math.max(VW - ww, VW / 2 - G.x * TS));
  return [cx, FLOOR_Y];
}

function drawPerson(x, y, cloth, hair, scale, face, alpha = 1, plain = false) {
  const s = TS * scale;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, s * 0.32, s * 0.28, s * 0.1, 0, 0, 7); ctx.fill();
  ctx.fillStyle = cloth; ctx.beginPath(); ctx.moveTo(-s * 0.24, s * 0.3); ctx.lineTo(s * 0.24, s * 0.3); ctx.lineTo(s * 0.14, -s * 0.12); ctx.lineTo(-s * 0.14, -s * 0.12); ctx.fill();
  // 頭（少し大きめにして顔を見やすくする）
  const hy = -s * 0.27, hr = s * 0.2;
  if (face[1] < 0) {   // 後ろ姿：髪だけ
    ctx.fillStyle = '#efd9c8'; ctx.beginPath(); ctx.arc(0, hy, hr, 0, 7); ctx.fill();
    ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, hy, hr * 1.06, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  const fx = face[0] * hr * 0.35;   // 横を向くと顔が寄る
  // 後ろ髪
  ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(-fx * 0.3, hy + hr * 0.15, hr * 1.08, hr * 1.05, 0, 0, 7); ctx.fill();
  // 顔
  ctx.fillStyle = '#efd9c8'; ctx.beginPath(); ctx.ellipse(fx * 0.4, hy + hr * 0.12, hr * 0.86, hr * 0.84, 0, 0, 7); ctx.fill();
  // 前髪
  ctx.fillStyle = hair; ctx.beginPath();
  ctx.moveTo(-hr * 1.05, hy + hr * 0.1);
  ctx.quadraticCurveTo(-hr * 0.9, hy - hr * 1.15, 0, hy - hr * 1.05);
  ctx.quadraticCurveTo(hr * 0.9, hy - hr * 1.15, hr * 1.05, hy + hr * 0.1);
  ctx.lineTo(hr * 0.6 + fx, hy - hr * 0.15); ctx.lineTo(hr * 0.25 + fx, hy - hr * 0.3); ctx.lineTo(fx, hy - hr * 0.12);
  ctx.lineTo(-hr * 0.3 + fx, hy - hr * 0.32); ctx.lineTo(-hr * 0.65 + fx, hy - hr * 0.12);
  ctx.closePath(); ctx.fill();
  // 目（瞬きあり）
  const blinkNow = Math.sin(RT.t * 0.9 + x * 0.37) > 0.985;
  const eh = blinkNow ? hr * 0.05 : hr * 0.24, ew = hr * 0.16, ey = hy + hr * 0.2;
  const ea = fx * 1.2, eyes = face[0] === 0 ? [-hr * 0.35, hr * 0.35] : [ea - hr * 0.28, ea + hr * 0.28];
  if (plain) { ctx.restore(); return; }   // 人形は顔を描かない（うつろな目は drawEnemy で描く）
  for (const exx of eyes) {
    ctx.fillStyle = '#2a1e2a'; ctx.beginPath(); ctx.ellipse(exx, ey, ew, eh, 0, 0, 7); ctx.fill();
    if (!blinkNow) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(exx + ew * 0.3, ey - eh * 0.35, ew * 0.38, 0, 7); ctx.fill(); }
  }
  // 頬と口
  ctx.fillStyle = 'rgba(230,120,130,.35)';
  for (const exx of eyes) { ctx.beginPath(); ctx.ellipse(exx + (exx < fx ? -1 : 1) * hr * 0.08, ey + hr * 0.32, ew * 0.9, ew * 0.45, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(120,60,60,.7)'; ctx.lineWidth = Math.max(1, s * 0.012);
  ctx.beginPath(); ctx.moveTo(fx * 1.1 - hr * 0.08, hy + hr * 0.6); ctx.lineTo(fx * 1.1 + hr * 0.08, hy + hr * 0.6); ctx.stroke();
  ctx.restore();
}
// 燭台（真鍮の台とろうそく）
function drawCandleStand(cx, cy) {
  const s = TS;
  ctx.fillStyle = '#7a5a2a'; ctx.beginPath(); ctx.ellipse(cx, cy + s * 0.32, s * 0.26, s * 0.08, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#a07a38'; ctx.fillRect(cx - s * 0.04, cy - s * 0.02, s * 0.08, s * 0.34);
  ctx.fillStyle = '#b8904a'; ctx.beginPath(); ctx.ellipse(cx, cy - s * 0.02, s * 0.16, s * 0.05, 0, 0, 7); ctx.fill();
  const g = ctx.createLinearGradient(cx - s * 0.07, 0, cx + s * 0.07, 0);
  g.addColorStop(0, '#cbbf9f'); g.addColorStop(0.45, '#f6efdc'); g.addColorStop(1, '#b8aa88');
  ctx.fillStyle = g; ctx.fillRect(cx - s * 0.07, cy - s * 0.24, s * 0.14, s * 0.23);
  ctx.fillStyle = '#efe6cc'; ctx.beginPath(); ctx.ellipse(cx, cy - s * 0.24, s * 0.07, s * 0.025, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2a2018'; ctx.lineWidth = Math.max(1, s * 0.015); ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.24); ctx.lineTo(cx, cy - s * 0.29); ctx.stroke();
}
// ゆらめく炎：外の光・炎の本体・芯の近くの青・舞い上がる火の粉
function drawFlame(x, y, size, seed) {
  const t = RT.t + seed;
  const h = size * (1.25 + Math.sin(t * 11) * 0.12 + Math.sin(t * 23.7) * 0.08 + Math.sin(t * 5.3) * 0.06);
  const sway = (Math.sin(t * 4.1) * 0.5 + Math.sin(t * 9.7) * 0.3) * size * 0.18;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(x, y - h * 0.3, 0, x, y - h * 0.3, size * 3.2);
  glow.addColorStop(0, 'rgba(255,170,70,.35)'); glow.addColorStop(0.4, 'rgba(255,120,40,.12)'); glow.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y - h * 0.3, size * 3.2, 0, 7); ctx.fill();
  const w = size * 0.42;
  const flame = (k, c0, c1) => {
    const hh = h * k, ww = w * k, tx = x + sway * k;
    const g = ctx.createLinearGradient(x, y, x, y - hh);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.beginPath();
    ctx.moveTo(x, y + ww * 0.5);
    ctx.bezierCurveTo(x - ww * 1.2, y + ww * 0.3, x - ww * 0.8, y - hh * 0.55, tx, y - hh);
    ctx.bezierCurveTo(x + ww * 0.8, y - hh * 0.55, x + ww * 1.2, y + ww * 0.3, x, y + ww * 0.5);
    ctx.fill();
  };
  flame(1, 'rgba(255,110,30,.9)', 'rgba(255,60,10,0)');
  flame(0.72, 'rgba(255,200,80,.95)', 'rgba(255,150,40,.1)');
  flame(0.42, 'rgba(255,250,220,1)', 'rgba(255,230,150,.3)');
  ctx.fillStyle = 'rgba(90,140,255,.45)'; ctx.beginPath(); ctx.ellipse(x, y + w * 0.15, w * 0.35, w * 0.3, 0, 0, 7); ctx.fill();
  for (let i = 0; i < 3; i++) {   // 火の粉
    const ph = ((RT.t * 0.6 + i / 3 + seed * 0.13) % 1 + 1) % 1;
    const ex = x + sway + Math.sin(ph * 7 + i * 2 + seed) * size * 0.5, ey = y - h - ph * size * 2.6;
    ctx.fillStyle = `rgba(255,${160 + i * 30},80,${(1 - ph) * 0.8})`;
    ctx.beginPath(); ctx.arc(ex, ey, Math.max(0.8, size * 0.07 * (1 - ph)), 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawEnemy(e, ox, oy) {
  const x = ox + e.x * TS, y = oy + e.y * TS, s = TS * num(e.d['大きさ'], 1), col = e.d['色'] || '#ddd';
  const shape = e.d['形'] || '';
  const who = /^人[:：](.+)$/.exec(shape);
  if (who) {   // 人:名前 … characters.md のその人の色で描く（会話の相手など）
    const c = charByName(who[1].trim()) || {}, dx = G.x - e.x, dy = G.y - e.y;
    const face = Math.hypot(dx, dy) < 4 ? (Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy) || 1]) : [0, 1];
    drawPerson(x, y, c['服'] || col, c['髪'] || '#333', num(c['背'], 1), face);
  } else if (shape === '影') {
    ctx.save(); ctx.globalAlpha = 0.85;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, s * 0.5); gr.addColorStop(0, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, 7); ctx.fill();
    const fo = (e.face || 0) * s * 0.12;   // 横スクロール版：目が向いている方へ寄る
    ctx.fillStyle = '#e03040'; ctx.fillRect(x - s * 0.12 + fo, y - s * 0.08, s * 0.06, s * 0.04); ctx.fillRect(x + s * 0.06 + fo, y - s * 0.08, s * 0.06, s * 0.04);
    ctx.restore();
  } else if (shape === '獣') {   // 四つ足の融合生物
    const fx = (G.x - e.x) >= 0 ? 1 : -1, step = Math.sin(e.t * 10) * s * 0.06;
    ctx.save(); ctx.translate(x, y); ctx.scale(fx, 1);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, s * 0.3, s * 0.4, s * 0.1, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = s * 0.08; ctx.lineCap = 'round';
    for (const [lx, ph] of [[-0.22, 1], [-0.1, -1], [0.14, -1], [0.26, 1]]) { ctx.beginPath(); ctx.moveTo(s * lx, s * 0.05); ctx.lineTo(s * lx + step * ph, s * 0.28); ctx.stroke(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 0, s * 0.34, s * 0.17, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.05); ctx.quadraticCurveTo(-s * 0.55, -s * 0.2, -s * 0.5, s * 0.05); ctx.lineWidth = s * 0.05; ctx.stroke();   // しっぽ
    ctx.beginPath(); ctx.arc(s * 0.36, -s * 0.12, s * 0.15, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 0.3, -s * 0.24); ctx.lineTo(s * 0.34, -s * 0.38); ctx.lineTo(s * 0.4, -s * 0.25); ctx.fill();   // 耳
    ctx.fillStyle = '#e8d040'; ctx.fillRect(s * 0.4, -s * 0.16, s * 0.05, s * 0.04);
    ctx.fillStyle = '#c03040'; ctx.fillRect(s * 0.33, -s * 0.15, s * 0.04, s * 0.04);   // 色の違う目
    ctx.restore();
  } else if (shape === '菌') {   // 菌糸のかたまり。触手がうねる
    const g = e.grow ?? 1, r = s * 0.32 * (0.4 + 0.6 * g);
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, s * 0.04); ctx.globalAlpha = 0.8;
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * Math.PI * 2 + Math.sin(e.t * 1.3 + i) * 0.3, l = r * (1.6 + Math.sin(e.t * 2 + i * 1.7) * 0.3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(Math.cos(a + 0.6) * l * 0.6, Math.sin(a + 0.6) * l * 0.6, Math.cos(a) * l, Math.sin(a) * l); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,.5)';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 1.9) * r * 0.5, Math.sin(i * 1.9) * r * 0.5, r * 0.15, 0, 7); ctx.fill(); }
    ctx.restore();
  } else if (shape === '鏡') {   // 主人公と同じ姿の、銀色の写し
    const hero = roleChar('主人公') || {}, dx = G.x - e.x, dy = G.y - e.y;
    const face = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy) || 1];
    drawPerson(x, y, col, hero['髪'] || '#888', num(e.d['大きさ'], 1), face, 0.75);
    if (e.st === 'learn') { ctx.strokeStyle = 'rgba(180,220,255,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, s * 0.5 + Math.sin(RT.t * 6) * 2, 0, 7); ctx.stroke(); }
  } else if (shape === '目玉') {
    const lx = (G.x - e.x), ly = (G.y - e.y), l = Math.hypot(lx, ly) || 1;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, s * 0.36, 0, 7); ctx.fill();
    ctx.strokeStyle = '#a03040'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = e.st === 'wake' ? '#d02030' : '#6a3040'; ctx.beginPath(); ctx.arc(x + lx / l * s * 0.14, y + ly / l * s * 0.14, s * 0.15, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x + lx / l * s * 0.17, y + ly / l * s * 0.17, s * 0.06, 0, 7); ctx.fill();
  } else {
    const jitter = e.st === 'freeze' ? 0 : Math.sin(e.t * 9) * 1.2;
    drawPerson(x + jitter, y, col, '#3a2a30', num(e.d['大きさ'], 0.8), [0, 1], 1, true);
    ctx.fillStyle = '#000'; ctx.fillRect(x - s * 0.1, y - s * 0.22, s * 0.05, s * 0.07); ctx.fillRect(x + s * 0.05, y - s * 0.22, s * 0.05, s * 0.07);
    if (e.st === 'wind') { ctx.fillStyle = '#e03040'; ctx.font = `24px DenkiChip, sans-serif`; ctx.textAlign = 'center'; ctx.fillText('!', x, y - s * 0.55); }
  }
}
function drawMarks(e, ox, oy) {
  const x = ox + e.x * TS, y = oy + e.y * TS - TS * num(e.d['大きさ'], 1) * 0.7;
  let ch = '', col = '#e03040';
  if (RT.stun > 0) { ch = '…'; col = '#a0c0ff'; }
  else if (e.mark > 0) ch = '!';
  else if (e.st === 'lost') { ch = '?'; col = '#ffd060'; }
  if (!ch) return;
  ctx.fillStyle = col; ctx.font = `24px DenkiChip, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(ch, x, y);
}
function drawGuard(g, ox, oy) {
  const x = ox + g.x * TS, y = oy + g.y * TS, s = TS * num(g.d['大きさ'], 1.6);
  const c = charByName(g.d['名前']);   // 番人ごとの色（characters.md に同名がいればその服の色）
  ctx.save(); ctx.globalAlpha = g.alpha;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.3, s * 0.32, s * 0.1, 0, 0, 7); ctx.fill();
  ctx.fillStyle = (c && c['服']) || g.d['色'] || '#222';
  ctx.beginPath(); ctx.moveTo(x - s * 0.3, y + s * 0.3); ctx.lineTo(x + s * 0.3, y + s * 0.3); ctx.lineTo(x + s * 0.12, y - s * 0.45); ctx.lineTo(x - s * 0.12, y - s * 0.45); ctx.fill();
  ctx.strokeStyle = '#c8a860'; ctx.lineWidth = 2; const sw = Math.sin(RT.t * 3) * 0.6;

  ctx.fillStyle = '#c8a860'; ctx.beginPath(); ctx.arc(x + Math.sin(sw) * s * 0.35, y - s * 0.1 + Math.cos(sw) * s * 0.35, s * 0.06, 0, 7); ctx.fill();

    case '非常灯': return drawExitSign(cx, fy - s * 2.55);
    case '窓口': return drawWicket(cx, wy);
    case 'パネル': return drawPanel(cx, fy - s * 1.6, st === '開');
    case '人': return drawSomeone(st, cx, fy);
  }
  if (ob.o['絵']) {
    ctx.font = `${Math.floor(s * 0.7)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ddd';
    ctx.fillText(ob.o['絵'], cx, ob.layer === 'wall' ? wy : fy - s * 0.4);
  } else if (k === '隠れる') drawCurtain(cx, fy, col);
  else if (k === '障害') drawBox(cx, fy, col || '#3a3028');
  else if (col) { if (ob.layer === 'wall') { ctx.fillStyle = col; ctx.fillRect(cx - s * 0.3, wy - s * 0.3, s * 0.6, s * 0.6); } else drawBox(cx, fy, col); }
}
// 見た目と「絵」の両方があるとき、家具の上に絵を小さく置く（机の上の日誌など）
function onTop(ob, cx, y) {
  if (!ob.o['絵'] || /^ロッカー/.test(lookOf(ob))) return;
  ctx.font = `${Math.floor(TS * 0.4)}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#ddd';
  ctx.fillText(ob.o['絵'], cx, y);
}
// [落書き] の文字（壁に残る赤い字）
function drawWriting(text, cx, y) {
  ctx.save(); ctx.font = `${TS >= 80 ? 36 : 24}px DenkiChip, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(170,16,16,.9)'; ctx.fillText(text, cx, y);
  const w = ctx.measureText(text).width; ctx.fillStyle = 'rgba(150,10,10,.7)';
  for (let i = 0; i < 4; i++) { const dx = -w / 2 + w * (i * 0.29 + 0.08); ctx.fillRect(cx + dx, y + 8, 2, 6 + (i * 7) % 13); }
  ctx.restore();
}
// [手] 壁から伸びる白い腕
function drawHands(h, x, y) {
  const s = TS, t = h.t;
  const reach = t < 0.9 ? t / 0.9 * 0.12 : t < 2.2 ? Math.min(1, 0.12 + (t - 0.9) * 3) : Math.max(0, 1 - (t - 2.2) / 0.6);
  for (let i = 0; i < 6; i++) {
    const side = i % 2 ? 1 : -1, row = (i >> 1) - 1, wob = Math.sin(RT.t * 6 + i * 2 + h.seed) * s * 0.05;
    const sx = x + side * s * 0.08, sy = y + row * s * 0.32, ex = sx + side * s * (1.0 + (i % 3) * 0.15) * reach, ey = sy + (row * 0.2 + 0.25) * s * reach + wob;
    ctx.strokeStyle = 'rgba(40,30,30,.8)'; ctx.lineWidth = s * 0.11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo((sx + ex) / 2, sy - s * 0.15 * reach, ex, ey); ctx.stroke();
    ctx.strokeStyle = '#d8d0c8'; ctx.lineWidth = s * 0.08; ctx.stroke();
    if (reach > 0.05) {
      el(ex, ey, s * 0.07, s * 0.06, '#e0d8d0');
      ctx.strokeStyle = '#e0d8d0'; ctx.lineWidth = Math.max(1, s * 0.022);
      for (let f = -2; f <= 2; f++) { ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + side * s * 0.12, ey + f * s * 0.035); ctx.stroke(); }
    }
  }
}
function drawMark(ch, col, x, y) { ctx.fillStyle = col; ctx.font = `36px DenkiChip, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(ch, x, y); }

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (!G || !W.rooms[G.room] || S.mode === 'title') return;
  const rm = room(), [ox, fy] = cam(), s = TS, top = fy - s * 3, ww = rm.w * s;
  PSX = ox + G.x * s;
  // 壁・腰板・床
  ctx.fillStyle = rm.props['壁の色'] || '#2c2430'; ctx.fillRect(ox, top, ww, s * 3);
  ctx.fillStyle = 'rgba(255,255,255,.03)'; for (let i = 0; i < rm.w * 2; i += 2) ctx.fillRect(ox + i * s / 2, top, s / 4, s * 2.2);
  ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fillRect(ox, fy - s * 0.8, ww, s * 0.8);
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(ox, fy - s * 0.8, ww, 2);
  const cg = ctx.createLinearGradient(0, top, 0, top + s); cg.addColorStop(0, 'rgba(0,0,0,.7)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg; ctx.fillRect(ox, top, ww, s);
  ctx.fillStyle = rm.props['床の色'] || '#221a16'; ctx.fillRect(ox, fy, ww, s * 1.1);
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(ox, fy, ww, 3);
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
  for (const k of [0.22, 0.5, 0.85]) { ctx.beginPath(); ctx.moveTo(ox, fy + s * k); ctx.lineTo(ox + ww, fy + s * k); ctx.stroke(); }
  for (let x = 0; x < rm.w; x++) if (/[#|]/.test(colCh('wall', x) + colCh('floor', x))) { ctx.fillStyle = '#09070b'; ctx.fillRect(ox + x * s, top - s * 0.2, s, s * 4.4); }
  // 物
  const lights = [], tints = [];
  let hideOb = null;
  for (const ob of rm.objs) {
    if (!shown(ob)) continue;
    const k = ob.o['種類'], cx = ox + (ob.x + 0.5) * s, look = lookOf(ob);
    if (k === '隠れる' && RT.hide && RT.hideAt === ob) hideOb = ob;
    else if (k !== '敵' && k !== '番人位置' && cx > -s * 2 && cx < VW + s * 2) drawObj(ob, cx, fy);
    const lr = num(ob.o['光'], 0);
    if (lr > 0 && !/消/.test(look)) {
      const ly = ob.layer === 'wall' ? fy - s * 2.0 : fy - s * 0.6;
      lights.push([cx, ly, lr * s * (1 + Math.sin(RT.t * 9 + ob.x * 3) * 0.04 + Math.sin(RT.t * 23 + ob.x) * 0.02)]);
      if (/赤/.test(look)) tints.push([cx, ly, lr * s * 1.8]);
    }
    const wr = G.writes[lookKey(G.room, ob.sym)];
    if (wr) drawWriting(wr, cx, ob.layer === 'wall' ? fy - s * 2.62 : fy - s * 2.2);
  }
  for (const h of RT.hazards) drawHands(h, ox + h.x * s, fy - s * 1.75);
  // 人物（e.x の位置を 0 にして、ACT 倍で描く。既存の人物・敵の絵をそのまま使う）
  const actor = (x, sz, fn) => { ctx.save(); ctx.translate(ox + x * s, fy - s * 0.05); ctx.scale(ACT, ACT); fn(-x * s, -s * 0.32 * sz); ctx.restore(); };
  RT.enemies.forEach(e => actor(e.x, num(e.d['大きさ'], 1), (a, b) => drawEnemy(e, a, b)));
  // 番人は 1.25 倍（大きさ 2 で、ちょうど壁の 3 分の 2 ほど）
  const guardAt = () => { const g = RT.guard; ctx.save(); ctx.translate(ox + g.x * s, fy - s * 0.05); ctx.scale(1.25, 1.25); drawGuard(g, -g.x * s, -s * 0.3 * num(g.d['大きさ'], 1.6)); ctx.restore(); };
  if (RT.guard) guardAt();
  if (RT.comp && G.companion) {
    const c = charByName(G.companion) || roleChar('同行者');
    if (c) actor(RT.comp.x, num(c['背'], 1), (a, b) => drawPerson(0, b, c['服'], c['髪'], num(c['背'], 1), RT.comp.face || [1, 0]));
  }
  const hero = roleChar('主人公') || { 服: '#aaa', 髪: '#333', 背: 1 };
  const blink = RT.inv > 0 && Math.floor(RT.t * 12) % 2;
  const bob = RT.walk ? -Math.abs(Math.sin(RT.walk * 9)) * s * 0.012 : 0;
  const inLocker = RT.hide && RT.hideAt && isLocker(RT.hideAt);
  if (!inLocker) actor(G.x, num(hero['背'], 1), (a, b) => drawPerson(0, b + bob, hero['服'], hero['髪'], num(hero['背'], 1), G.face, RT.hide || blink ? 0.35 : 1));
  if (hideOb && !inLocker) drawObj(hideOb, ox + (hideOb.x + 0.5) * s, fy);   // 隠れている物は手前に描く（ロッカーは中から見るので描かない）
  ctx.fillStyle = '#ffd0a0';
  for (const sh of RT.shots) { ctx.beginPath(); ctx.arc(ox + sh.x * s, fy - s * 0.9, s * 0.1, 0, 7); ctx.fill(); }
  // 闇と灯
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, VW, VH);
  const bright = Math.max(0, Math.min(1, num(rm.props['明るさ'], 0)));
  dctx.fillStyle = `rgba(4,2,8,${(0.95 * (1 - bright)).toFixed(3)})`; dctx.fillRect(0, 0, VW, VH);
  dctx.globalCompositeOperation = 'destination-out';
  const flick = Math.sin(RT.t * 7) * 0.04 + Math.sin(RT.t * 13) * 0.03;
  lights.push([PSX, fy - s * 0.95, s * (1.3 + effLight() * 0.5) * (1 + flick)]);
  for (const [x, y, r] of lights) {
    const gr = dctx.createRadialGradient(x, y, r * 0.15, x, y, r);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.6, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = gr; dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fill();
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
  for (const [x, y, r] of tints) {   // 赤い灯りは部屋を赤く染める
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,70,60,1)'); g.addColorStop(1, 'rgba(255,70,60,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
  }
  // 見回りの視線（向いている方を、うっすら赤く）
  for (const e of RT.enemies) {
    if (!/^見回り/.test(e.d['動き'] || '') || RT.stun > 0) continue;
    const v1 = num(moveDef(e.d['動き'])['値1'], 0), x0 = ox + e.x * s, x1 = x0 + e.face * v1 * s;
    const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, `rgba(255,40,40,${e.st === 'chase' ? 0.22 : 0.1})`); g.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x1), fy - s * 1.6, Math.abs(x1 - x0), s * 1.6);
  }
  for (const e of RT.enemies) {   // ! ? …
    const x = ox + e.x * s, y = fy - s * ACT * num(e.d['大きさ'], 1) * 0.95;
    if (RT.stun > 0) drawMark('…', '#a0c0ff', x, y);
    else if (e.mark > 0) drawMark('!', '#e03040', x, y);
    else if (e.st === 'lost') drawMark('?', '#ffd060', x, y);
  }
  // 番人の技の予告（赤い範囲）
  for (const a of RT.warns) {
    const k = 1 - a.t / a.total, L = num(a.sk['長さ'], 3) * s, x0 = ox + a.ox * s, y0 = fy - s * 2, hh = s * 2;
    ctx.fillStyle = `rgba(220,40,60,${0.12 + k * 0.3})`; ctx.strokeStyle = 'rgba(255,80,90,.8)'; ctx.lineWidth = 1;
    if (a.sk['種類'] === '前') { ctx.fillRect(a.dir > 0 ? x0 : x0 - L * k, y0, L * k, hh); ctx.strokeRect(a.dir > 0 ? x0 : x0 - L, y0, L, hh); }
    else if (a.sk['種類'] === '円') { ctx.fillRect(x0 - L * k, y0, L * k * 2, hh); ctx.strokeRect(x0 - L, y0, L * 2, hh); }
    else ctx.fillRect(a.dir > 0 ? x0 : x0 - s * 1.5 * k, fy - s * 0.95, s * 1.5 * k, s * 0.1);
  }
  if (RT.guard) { const a0 = RT.guard.alpha; RT.guard.alpha = a0 * 0.35; guardAt(); RT.guard.alpha = a0; }   // 闇の中でも少し見せる
  // 浮かぶ文字（[文字]）
  for (const f of RT.floats) {
    const a = f.t < 0.4 ? f.t / 0.4 : f.t > f.dur - 0.6 ? Math.max(0, (f.dur - f.t) / 0.6) : 1, n = Math.min(f.text.length, Math.floor(f.t * 7) + 1);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#e02828'; ctx.shadowColor = 'rgba(255,0,0,.7)'; ctx.shadowBlur = 14;
    ctx.font = `${TS >= 80 ? 48 : 36}px DenkiChip, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.text.slice(0, n), ox + f.x * s + Math.sin(RT.t * 40) * 1.5, fy - s * 2.3); ctx.restore();
  }
  // 調べられる物の印
  if (S.mode === 'play' && (!RT.busy || RT.chase) && !RT.hide) {
    const t = nearObj(!!RT.chase);
    if (t) {
      const hx = ox + (t.x + 0.5) * s, hy = fy - s * objTop(t) - 6 + Math.sin(RT.t * 5) * 3;
      ctx.fillStyle = `rgba(232,184,96,${0.6 + Math.sin(RT.t * 5) * 0.3})`;
      ctx.beginPath(); ctx.moveTo(hx - 7, hy - 9); ctx.lineTo(hx + 7, hy - 9); ctx.lineTo(hx, hy); ctx.fill();
    }
  }
  if (inLocker) drawLockerView(fy);
  if (RT.flash > 0) { ctx.fillStyle = `rgba(200,30,50,${RT.flash})`; ctx.fillRect(0, 0, VW, VH); }
}

// ロッカーの中から見た画面：横に細いすき間だけが見える。敵が近いほど、心臓の音に合わせて赤く脈打つ
function drawLockerView(fy) {
  const s = TS, n = 5, sh = Math.max(8, s * 0.22), gap = Math.max(4, s * 0.1), top = fy - s * 2.0;
  const near = RT.enemies.reduce((m, e) => Math.min(m, Math.abs(e.x - G.x)), RT.guard ? Math.abs(RT.guard.x - G.x) : 99);
  const fear = Math.max(0, 1 - near / 4), beat = fear ? Math.pow(Math.max(0, Math.sin(RT.t * (5 + fear * 6))), 6) : 0;
  const jx = fear * Math.sin(RT.t * 37) * 1.5;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, VH);
  for (let i = 0; i < n; i++) ctx.rect(VW * 0.1 + jx, top + i * (sh + gap), VW * 0.8, sh);
  ctx.fillStyle = 'rgba(6,5,7,.96)'; ctx.fill('evenodd');
  ctx.strokeStyle = 'rgba(90,96,100,.5)'; ctx.lineWidth = 1;   // すき間のふち（鉄板）
  for (let i = 0; i < n; i++) ctx.strokeRect(VW * 0.1 + jx, top + i * (sh + gap), VW * 0.8, sh);
  const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.2, VW / 2, VH / 2, VH * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(140,0,12,${(beat * 0.5 * fear).toFixed(3)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(200,190,180,.55)'; ctx.font = '12px DenkiChip, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('左右に動くと出る', VW / 2, top + n * (sh + gap) + 28);
  ctx.restore();
}

/* ====================== ループ ====================== */
let last = performance.now(), lastTalking = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; RT.t += dt;
  const paused = !!document.querySelector('dialog[open]');
  if (S.mode === 'play' && G && !paused) {
    if (G.buff > 0) { G.buff = Math.max(0, G.buff - dt); const b = $('#buff'), txt = G.buff > 0 ? `光+${G.buffLv} ${Math.floor(G.buff / 60)}:${String(Math.floor(G.buff % 60)).padStart(2, '0')}` : ''; if (b.textContent !== txt) b.textContent = txt; }
    else if ($('#buff').textContent) $('#buff').textContent = '';
    RT.stun = Math.max(0, RT.stun - dt);
    if (!RT.busy || RT.chase) RT.grace = Math.max(0, (RT.grace || 0) - dt);
    const free = !RT.busy || RT.chase;
    if (free) { updatePlayer(dt); updateEnemies(dt); if (S.mode === 'play') updateHazards(dt); }
    if (RT.chase && S.mode === 'play') updateChase(dt);
    RT.floats.forEach(f => f.t += dt); RT.floats = RT.floats.filter(f => f.t < f.dur);
    RT.inv = Math.max(0, RT.inv - dt); RT.flash = Math.max(0, RT.flash - dt);
    if (RT.comp) {   // 同行者は少し後ろをついてくる
      const d = G.x - G.face[0] * 0.9 - RT.comp.x;
      if (Math.abs(d) > 0.1) { RT.comp.x += d * Math.min(1, dt * 4); RT.comp.face = [Math.sign(d), 0]; }
      else RT.comp.face = [Math.sign(G.x - RT.comp.x) || 1, 0];
      if (Math.abs(d) > 4) RT.comp.x = G.x - G.face[0] * 0.9;
    }
  }
  const talking = S.mode === 'play' && RT.busy && !RT.chase;
  if (talking !== lastTalking) { lastTalking = talking; document.body.classList.toggle('talking', talking); }
  draw();
  if (++miniTick % 6 === 0) drawMini();
  requestAnimationFrame(loop);
}


/* ====================== Markdown 読み込み UI ====================== */
function openMd() { $('#mdInfo').textContent = loadedInfo(); $('#mdDlg').showModal(); }
function loadedInfo() {
  const by = {};
  Object.values(RAW).forEach(s => (by[s.src] = by[s.src] || []).push(s.head));
  return Object.entries(by).map(([k, v]) => `${k}: ${v.length} 見出し`).join(' / ');
}
function applyUser(text, src) {
  const heads = applyText(text, src);
  if (!heads.length) { toast('## 見出しが見つかりませんでした'); return; }
  rebuild();
  toast(`${src}: ${heads.length} 見出しを反映`);
}
function rebuild() {
  W = buildWorld(); MINI = null;
  if (S.mode === 'title') { titleScreen(); return; }
  if (G && W.rooms[G.room]) {
    const rm = room();
    if (G.x > rm.w || blocked(G.x)) enterRoom(G.room, null); else enterRoom(G.room, null, true);
  } else if (G) { enterRoom(setting('開始部屋', Object.keys(W.rooms)[0])); }
  updateHud();
}
$('#btnMd').onclick = openMd;
$('#mdClose').onclick = () => $('#mdDlg').close();
$('#mdApply').onclick = () => { const t = $('#mdText').value; if (t.trim()) { applyUser(t, '貼り付け'); $('#mdText').value = ''; $('#mdInfo').textContent = loadedInfo(); } };
$('#mdReset').onclick = () => { RAW = { ...DEFAULT_RAW }; rebuild(); toast('最初の定義に戻しました'); $('#mdInfo').textContent = loadedInfo(); };
$('#mdRestart').onclick = () => { $('#mdDlg').close(); newGame(); };
$('#mdFile').onchange = async e => { for (const f of e.target.files) applyUser(await f.text(), f.name); e.target.value = ''; $('#mdInfo').textContent = loadedInfo(); };
$('#btnInv').onclick = openInv;
$('#invClose').onclick = () => $('#invDlg').close();
addEventListener('dragover', e => { e.preventDefault(); $('#drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').style.display = 'none'; });
addEventListener('drop', async e => {
  e.preventDefault(); $('#drop').style.display = 'none';
  for (const f of e.dataTransfer.files) if (/\.(md|markdown|txt)$/i.test(f.name)) applyUser(await f.text(), f.name);
});

/* ====================== 起動 ====================== */
async function boot() {
  for (const f of FILES) {
    let text = null;
    try { const r = await fetch(f, { cache: 'no-cache' }); if (r.ok) text = await r.text(); } catch (e) {}
    if (text == null) { const el = document.querySelector(`script[type="text/markdown"][data-file="${f}"]`); if (el) text = el.textContent; }
    if (text != null) applyText(text, f, DEFAULT_RAW);
  }
  RAW = { ...DEFAULT_RAW };
  W = buildWorld();
  resize();
  titleScreen();
  requestAnimationFrame(loop);
}
boot();
</script>
