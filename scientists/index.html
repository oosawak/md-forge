<script type="text/markdown" data-file="scenario.md">
# scenario.md — SCIENTISTS 設定とイベント

md-forge Horror エンジン（scientists/ 版）用のシナリオです。潜入からエンディング（5 種）まで。

## 設定

| 項目 | 値 |
| --- | --- |
| タイトル | SCIENTISTS |
| 説明 | エデン生命科学研究所に潜入し、研究を止めて脱出する。エンディングは 5 種類。 |
| 開始部屋 | entrance |
| 開始イベント | opening |
| 最初の灯 | 3 |
| 灯の最大 | 5 |
| 持ち物の上限 | 4 |
| キャッチ | 生命の価値を決めるのは、誰なのか。 |
| 入室の猶予 | 2 |
| 最初の目的 | 研究所の証拠（研究資料）を集める |

## 書き方（scientists/ 版で増えた命令）

> - `[数値 名前 +1]` `[数値 名前 -1]` `[数値 名前 =0]`：カウンタ。条件は `数値:名前>=3`。セリフの中で `{数値:名前}` と書くと値が入る。
> - `[解放 名前]`：エリアを解放する。条件は `解放:名前`。
> - `[入力 答え → イベント]`：文字を入力させる。答えは `|` で区切って複数書ける。ひらがな・カタカナ・全角半角・大文字小文字の違いは区別しない。外れたら次の行へ進む。
> - `[取得 物]`：消耗品（items.md の「使う」がある物）は「持ち物の上限」まで。いっぱいのときは `## イベント 満杯` へ移る。
> - `[目的 文]`：画面上部の「目的：」を書き換える（`{数値:名前}` も使える）。最初の目的は設定「最初の目的」。
> - `[暗く]` `[明るく]`：画面を黒くしたまま文を出す／元に戻す（導入や場面転換用）。
> - 設定「キャッチ」はタイトルの下の一文、「入室の猶予」は部屋に入ってから実験体に見つからない秒数。
> - `[追跡 名前 秒数 → イベント]`：灯が尽きたらゲームオーバーではなく、そのイベントへ移る。
> - 条件 `部屋:ID`：今いる部屋。items.md の使う欄 `イベント:名前` で、使ったときにイベントを動かせる。
> - カウンタ：資料（回収した研究資料）・真相（ノワとリヒトの真相に関わる資料）・救った・安楽死・見送った

## イベント 満杯

これ以上は持てない。何かを使ってから、もう一度調べよう。

## イベント opening

[暗く]
郊外の丘の上に、二十年前に廃校になった中学校がある。
窓は割れ、校庭は草に埋もれ、近所の子どもたちは「出る」と噂する。
だが、その地下と旧校舎には、今も明かりが灯っている。
——エデン生命科学研究所。
「生命は、科学によって自由に設計し、作り変えられるものである」
そう信じる者たちが、ここで命を作り、延ばし、混ぜ合わせている。
[待つ 0.6]
{主人公}「わたしはノワ。組織の壊滅のために送り込まれたスパイ」
{主人公}「任務は二つ。研究所の中で行われていることの証拠——研究資料を集めること。そして、研究を止めること」
{主人公}「戦う力はない。実験体に見つかったら、隠れるか、逃げるだけ」
> 操作の案内（黒い画面のまま出す）
【操作】移動：矢印キー・WASD・ドラッグ（スマホは左下のスティック）
【操作】調べる・会話を進める：スペース・クリック・タップ（スマホは「調べる」）
【操作】持ち物：I キー・「持ち物」ボタン。右上のろうそくが体力。実験体に触れると消える。
[明るく]
深夜。非常灯だけが、旧校舎の玄関ホールを照らしている。
{主人公}「……潜入、成功」
ふいに、頭の奥が痛んだ。この玄関を、知っている気がする。
{主人公}「……気のせい。まずは、このあたりを調べよう」
[目的 玄関ホールを調べてから、北の扉の先（中央棟）へ進む]

## イベント shoebox

[済 → shoebox_after]
古い下駄箱。ひとつだけ、新しい南京錠がかかっていない棚がある。
[取得 懐中電灯]
{主人公}「誰かが置いていった……？　まるで、わたしが来るのを知っていたみたい」

## イベント shoebox_after

上履きが並んでいる。名札はどれも削り取られている。

## イベント shoebox2

ほこりをかぶった上履き。小さなサイズだ。

## イベント board

掲示板に、古い時間割が貼られたままになっている。
その上に、新しい紙が一枚。
「研究棟A（生命延長）は、旧理科室棟。合言葉は主任のみ管理」

## イベント reception

[済 → reception_after]
受付の窓口。引き出しの奥に、薬の小瓶がある。
[取得 薬]

## イベント reception_after

受付の窓口。来客名簿は白紙だ。

## イベント exit_locked

正面の扉。外から板が打ちつけられていて、内側からは開かない。
{主人公}「出口は、別に探すしかない」

## イベント 入室:central

[分岐 フラグ:研究棟A_クリア & !済:phase1_end → phase1_end]
[済 → central_after]
旧校舎の一階廊下。教室の札はそのままに、扉だけが電子錠に替えられている。
{主人公}「西が職員室、東の渡り廊下が研究棟A……」
{主人公}「研究棟Aの扉は、電子錠で閉じているはず。職員室に手がかりがあるかもしれない」
[目的 職員室（西）で、研究棟Aに入る手がかりを探す]

## イベント central_after

> 2 回目以降は何もしない。

## イベント labB_locked

「研究棟B　遺伝子改良」の札。電子錠は赤く光っている。
{主人公}「カードキーが要る。研究棟Aの主任なら、持っているかもしれない」

## イベント labC_locked

「研究棟C　キメラ・軍事転用」の札。扉の向こうから、何かが這う音がする。
{主人公}「研究棟Bの主任のカードキーが要るみたい」

## イベント holding_locked

地下へ降りる階段。シャッターに、研究棟Cのカードリーダーがついている。

## イベント diary

[済 → diary_after]
研究員の日誌だ。
「生命延長計画は、最初の被験者から始まった。彼女は『トワ』と呼ばれた。永遠に生きるはずの子だった」
「主任は、あの子の名前を研究棟Aの合言葉にした。悪趣味だと思う」
「資料の原本は、本棚の奥の旧資料室に移した。あそこは誰も使わない」
[数値 資料 +1]
資料を手に入れた。（回収した資料 {数値:資料}）
[目的 研究棟A前室（中央棟の東）の電子錠に、合言葉を入れる]

## イベント diary_after

「トワ」「本棚の奥の旧資料室」——日誌の言葉を思い出す。

## イベント shelf

[分岐 フラグ:本棚を押した → shelf_after]
[分岐 !済:diary → shelf_plain]
日誌の言葉を思い出して、本棚の奥を押してみる。
ガコン、と重い音がして、壁の一部がずれた。
[フラグ 本棚を押した]
[揺れ]
{主人公}「隠し通路……」

## イベント shelf_plain

古い教育書が並んでいる。一冊だけ、奥に押し込まれたままの本がある。

## イベント shelf_after

本棚の横に、細い通路が口を開けている。

## イベント blackboard

黒板に、消し残しの文字がある。
「延命は救済か？　——生命の価値を決めるのは、誰なのか」

## イベント desk

机の上に、吸い殻が山になった灰皿がある。最近まで誰かがいたらしい。

## イベント sink

[済 → sink_after]
流しに、空き瓶が転がっている。投げれば音で気をそらせそうだ。
[取得 空き瓶]

## イベント sink_after

流しの蛇口から、水が一滴ずつ落ちている。

## イベント 入室:archive

[済 → archive_after]
ほこりの匂い。誰にも忘れられた部屋だ。

## イベント archive_after

> 2 回目以降は何もしない。

## イベント archive_files

[済 → archive_files_after]
棚の奥に、一冊だけ新しいファイルがある。
「被験体 N-0　経過観察記録（外部環境適応試験）」
「解放後、警察に保護。記憶処理は成功。本人は自身の出自を認識していない」
写真の部分は、切り取られている。
{主人公}「N-0……？」
[数値 資料 +1]
[数値 真相 +1]
[フラグ 真相_N0]
資料を手に入れた。（回収した資料 {数値:資料}）

## イベント archive_files_after

N-0 の記録。読み返すと、なぜか胸がざわつく。

## イベント archive_desk

[済 → archive_desk_after]
机の引き出しに、医療キットが残っていた。
[取得 医療キット]

## イベント archive_desk_after

空の引き出し。

## イベント gate_locked

電子錠がかかっている。横のパネルに、合言葉を入れるらしい。

          .replace(/\{数値[:：]([^}]+)\}/g, (_, n) => String(G ? (G.vars[n.trim()] || 0) : 0));

/* ====================== 部屋 ====================== */
function tileAt(x, y) { const r = room(); if (x < 0 || y < 0 || y >= r.h || x >= r.w) return '#'; return r.grid[y][x] || ' '; }

  return null;

  G.room = id;
  G.visited = G.visited || [];
  if (!G.visited.includes(id)) G.visited.push(id);
  if (!keepPos) {
    const p = (sym && findSym(sym)) || findSym('@') || floorTiles()[0] || [1, 1];
    G.x = p[0] + 0.5; G.y = p[1] + 0.5;

function spawnEnemies() { RT.enemies = []; refreshEnemies(); }
// 条件が合った敵を出し、合わなくなった敵を消す（イベントの後にも呼ぶ）
function refreshEnemies() {
  const r = room(), keep = [];
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const o = r.legend[r.grid[y][x]];
    if (!o || o['種類'] !== '敵' || !cond(o['条件'])) continue;
    const d = W.enemies[o['対象']];
    if (!d) continue;
    const key = x + ',' + y;
    keep.push(RT.enemies.find(e => e.key === key) || { key, d, x: x + 0.5, y: y + 0.5, hx: x + 0.5, hy: y + 0.5, t: Math.random() * 6, st: 'idle', timer: 0, vx: 0, vy: 0, cd: 1, mark: 0 });
  }

/* ====================== 条件 ====================== */
function cmp(a, op, b) { return op === '>=' ? a >= b : op === '<=' ? a <= b : op === '>' ? a > b : op === '<' ? a < b : a === b; }
function cond(s) {
  s = sub((s || '').trim());
  if (!s) return true;
  return s.split(/\s*[&＆]\s*/).every(c => {
    let neg = false, v, m;
    c = c.trim();
    if (/^[!！]/.test(c)) { neg = true; c = c.slice(1).trim(); }
    if ((m = /^持つ[:：](.+)$/.exec(c))) v = G.items.includes(m[1].trim());
    else if ((m = /^フラグ[:：](.+)$/.exec(c))) v = !!G.flags[m[1].trim()];
    else if ((m = /^済[:：](.+)$/.exec(c))) v = !!G.done[m[1].trim()];
    else if ((m = /^(好感|灯)\s*(>=|<=|==|=|>|<)\s*(-?\d+)$/.exec(c))) v = cmp(m[1] === '好感' ? G.aff : G.light, m[2], +m[3]);
    else if ((m = /^数値[:：](.+?)\s*(>=|<=|==|=|>|<)\s*(-?\d+)$/.exec(c))) v = cmp(G.vars[m[1].trim()] || 0, m[2], +m[3]);
    else if ((m = /^解放[:：](.+)$/.exec(c))) v = G.areas.includes(m[1].trim());
    else if ((m = /^部屋[:：](.+)$/.exec(c))) v = G.room === m[1].trim();

}

let dlgNext = null;

    d.querySelector('.choices').innerHTML = '';
    const nm = d.querySelector('.name'); nm.textContent = name || ''; nm.style.color = name ? nameColor(name) : '';

function choose(opts) {

    const d = $('#dlg'); d.hidden = false; d.querySelector('.next').hidden = true;
    const box = d.querySelector('.choices'); box.innerHTML = '';

      b.onclick = e => { e.stopPropagation(); done(i); };

let choiceKey = null;
function hideDlg() { $('#dlg').hidden = true; }
// 暗号入力：テキスト欄を出して、入力を返す
function askText() {

    const box = d.querySelector('.choices');
    box.innerHTML = '<div class="ask"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力"><button class="primary">決定</button><button>やめる</button></div>';

// 全角半角・大文字小文字・ひらがなカタカナの違いは同じとみなす

  return (s || '').normalize('NFKC').trim().toLowerCase().replace(/\s+/g, '').replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

/* ====================== イベント ====================== */
async function runEvent(id) {
  if (RT.busy || !id) return;
  RT.busy = true; keys.clear(); joy = null;
  try { await exec(id); }
  catch (e) { console.error(e); toast('イベントでエラー: ' + e.message); }
  finally { RT.busy = false; hideDlg(); updateHud(); if (S.mode === 'play') { refreshEnemies(); saveGame(); } }
}
async function exec(id, depth = 0) {
  if (depth > 50) throw new Error('イベントの移動が多すぎます: ' + id);
  const lines = W.events[id];
  if (!lines) { await say(null, `（イベント「${id}」がありません）`); return; }
  const first = !G.done[id];
  // 「済」は最後まで進んだときだけ付ける。途中で別のイベントへ移った（暗くて見えない・持ち物がいっぱい等）ときは、もう一度調べられる
  for (const raw of lines) {
    if (S.mode !== 'play') return 'stop';
    const ln = sub(raw);
    const m = /^\[(\S+)\s*([\s\S]*?)\]$/.exec(ln);
    if (m) {
      const r = await command(m[1], m[2].trim(), first);
      if (r === 'stop') return 'stop';
      if (r && r.goto) return exec(r.goto, depth + 1);
      continue;
    }
    const d = /^(.+?)「([\s\S]*)」$/.exec(ln);
    if (d) await say(d[1].trim(), d[2]); else await say(null, ln);
  }
  if (S.mode === 'play') G.done[id] = (G.done[id] || 0) + 1;
}
const arrow = s => s.split(/\s*(?:→|->)\s*/);
async function command(name, arg, first) {
  switch (name) {
    case '取得': {
      const cons = isConsumable(arg);
      if (!cons && G.items.includes(arg)) break;            // 大事な物は 1 つだけ
      if (cons && consumableCount() >= itemLimit()) {      // 持ち物の上限（消耗品だけ数える）
        if (W.events['満杯']) return { goto: '満杯' };
        await say(null, `${arg} を見つけたが、これ以上は持てない。`); break;
      }
      G.items.push(arg); updateHud(); await say(null, `${itemIcon(arg)} ${arg} を手に入れた。`); break;
    }
    case '失う': { const i = G.items.indexOf(arg); if (i >= 0) G.items.splice(i, 1); updateHud(); break; }
    case '数値': {   // [数値 名前 +1] / [数値 名前 -1] / [数値 名前 =0]
      const m = /^(.+?)\s*([+\-=＋－＝])\s*(-?\d+)$/.exec(arg);
      if (!m) { await say(null, `（[数値 ${arg}] の書き方が違います）`); break; }
      const k = m[1].trim(), v = +m[3], op = m[2].normalize('NFKC');
      G.vars[k] = op === '=' ? v : (G.vars[k] || 0) + (op === '+' ? v : -v);
      break;
    }
    case '解放': if (!G.areas.includes(arg)) G.areas.push(arg); break;
    case '入力': {   // [入力 答え → イベント]。答えは | で複数書ける
      const [ans, to] = arrow(arg);
      const v = await askText();
      if (v != null && ans.split(/[|｜]/).some(a => normAnswer(a) === normAnswer(v))) return { goto: to };
      break;
    }
    case 'フラグ': G.flags[arg] = true; break;
    case '消す': delete G.flags[arg]; break;
    case '灯': {
      const v = parseInt(arg, 10) || 0;
      if (v < 0) { for (let i = 0; i < -v; i++) hurt(true); if (S.mode !== 'play') return 'stop'; }
      else { G.light = Math.min(maxLight(), G.light + v); updateHud(); }
      break;
    }
    case '好感': G.aff += parseInt(arg, 10) || 0; break;
    case '分岐': { const [c, to] = arrow(arg); if (cond(c)) return { goto: to }; break; }
    case '済': { const [, to] = arrow(arg); if (!first) return { goto: to || arg }; break; }
    case '選択': {
      const opts = arg.split(/\s*[/／]\s*/).map(o => { const [label, to] = arrow(o); return { label, to }; });
      const o = await choose(opts);
      if (o.to) return { goto: o.to };
      break;
    }
    case '移動': {
      const [rid, sym] = arg.split(/[:：]/);
      await fade(true); enterRoom(rid.trim(), sym && sym.trim()); await fade(false);
      if (W.events['入室:' + rid.trim()]) await exec('入室:' + rid.trim());
      break;
    }
    case '追跡': {   // [追跡 名前 秒数] / [追跡 名前 秒数 → 灯が尽きたときのイベント]
      const [head, fail] = arrow(arg);
      const [gn, secs] = head.split(/\s+/);
      hideDlg();
      const r = await chase(gn, num(secs, 15), fail);
      if (r === 'fail') return { goto: fail };
      if (r === 'dead' || S.mode !== 'play') return 'stop';
      break;
    }
    case '同行': G.companion = arg; RT.comp = { x: G.x, y: G.y }; break;
    case '離脱': G.companion = null; RT.comp = null; break;
    case '揺れ': shake(); await wait(0.35); break;
    case '暗転': await fade(true); await wait(0.4); await fade(false); break;
    case '目的': G.goal = arg; updateGoal(true); break;   // 画面上部の「目的」を書き換える。{数値:名前} も使える
    case '暗く': hideDlg(); await fade(true); break;     // 黒い画面のまま、次の文を出す（導入・場面転換用）
    case '明るく': hideDlg(); await fade(false); break;
    case '待つ': hideDlg(); await wait(num(arg, 1)); break;
    case '止める': return 'stop';
    case '終わり': hideDlg(); ending(arg); return 'stop';
    case 'ゲームオーバー': hideDlg(); gameOver(arg); return 'stop';
    default: await say(null, `（命令「${name}」は知りません）`);
  }
}
const wait = s => new Promise(r => setTimeout(r, s * 1000));

/* ====================== 持ち物・灯 ====================== */
const maxLight = () => num(setting('灯の最大', 5), 5);

    const cls = i < G.light ? 'on' : (i < prev ? 'off out' : 'off');   // 今消えた灯は、しぼむように消す
    h += `<span class="cdl ${cls}"><i style="animation-delay:${(-i * 0.37).toFixed(2)}s"></i></span>`;
  }

const isConsumable = n => !!((W.items[n] || {})['使う'] || '').trim();

// 「使う」欄の効果。読点・カンマで複数書ける：灯+1 / 光+1 / 気をそらす
function applyEffect(spec) {

  for (const part of spec.split(/[、,，]/).map(s => s.trim()).filter(Boolean)) {
    let m;
    if ((m = /^灯\s*([+-]?\d+)$/.exec(part))) { G.light = Math.min(maxLight(), G.light + +m[1]); done.push('灯'); }
    else if ((m = /^光\s*([+-]?\d+)$/.exec(part))) { G.buffLv = Math.max(G.buffLv || 0, +m[1]); G.buff = 300; done.push('光'); }

  if (ev) { $('#invDlg').close(); if (!RT.busy) runEvent(ev[1].trim()); return; }   // 使った結果はイベントで決める

let MINI = null, miniBig = false, miniTick = 0;
function buildMiniLayout() {
  const pos = {}, edges = [], used = new Set(), start = setting('開始部屋', Object.keys(W.rooms)[0]);
  if (!W.rooms[start]) return { pos, edges };
  pos[start] = [0, 0]; used.add('0,0');
  const q = [start];
  while (q.length) {
    const id = q.shift(), r = W.rooms[id];
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
      const o = r.legend[r.grid[y][x]];
      if (!o || !/扉/.test(o['種類'])) continue;
      const to = (o['対象'] || '').split(/[:：]/)[0].trim();
      if (!W.rooms[to]) continue;
      if (!edges.some(e => (e.a === id && e.b === to) || (e.a === to && e.b === id))) edges.push({ a: id, b: to, o });
      if (pos[to]) continue;

  const vis = new Set(G.visited || []);
  // 見せる線：訪れた部屋から出ていて、隠し扉なら条件が合っているもの
  const edges = MINI.edges.filter(e => (vis.has(e.a) || vis.has(e.b)) && (e.o['種類'] !== '隠し扉' || cond(e.o['条件']) || (vis.has(e.a) && vis.has(e.b))));

  c.hidden = false;

  const at = id => { const [x, y] = MINI.pos[id]; return [pad + (x - minX) * (cw + gap), pad + (y - minY) * (chh + gap)]; };
  g.strokeStyle = 'rgba(200,210,220,.45)'; g.lineWidth = 1.5;

    g.fillRect(x, y, cw, chh);

    g.setLineDash(seen ? [] : [3, 2]); g.lineWidth = cur ? 2 : 1; g.strokeRect(x + 0.5, y + 0.5, cw - 1, chh - 1); g.setLineDash([]);

      const r = room(); g.fillStyle = '#fff4c0';

    }
    if (miniBig) { g.fillStyle = seen ? '#d8e0e8' : '#7a828c'; g.font = '12px DenkiChip, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
      const nm = seen ? (W.rooms[id].name || id) : '？'; g.fillText(nm.length > 7 ? nm.slice(0, 7) : nm, x + cw / 2, y + chh + 2); }
  }

    const ch = rm.grid[y][x] || ' ', px = ox + x * TS, py = oy + y * TS;
    if (ch === ' ') continue;
    const hid = rm.legend[ch] && rm.legend[ch]['種類'] === '隠し扉' && !cond(rm.legend[ch]['条件']);
    if (ch === '#' || hid) {
      ctx.fillStyle = '#1a1520'; ctx.fillRect(px, py, TS, TS);
      if (!isSolid(x, y + 1)) { ctx.fillStyle = '#2a2230'; ctx.fillRect(px, py + TS * 0.55, TS, TS * 0.45); ctx.fillStyle = '#3a2f40'; ctx.fillRect(px, py + TS * 0.55, TS, 2); }
      continue;
    }
    ctx.fillStyle = (x + y) % 2 ? '#2b2228' : '#30262d'; ctx.fillRect(px, py, TS, TS);
    const o = rm.legend[ch];
    if (!o) continue;
    const kind = o['種類'];
    if (kind === '扉' || kind === '隠し扉') {
      ctx.fillStyle = o['色'] || '#4a3020'; ctx.fillRect(px + 2, py + 2, TS - 4, TS - 4);
      ctx.fillStyle = cond(o['条件']) ? '#d8b060' : '#705040'; ctx.beginPath(); ctx.arc(px + TS * 0.7, py + TS * 0.5, TS * 0.07, 0, 7); ctx.fill();
    } else if (kind === '調べる' || kind === '置物') {
      ctx.fillStyle = o['色'] || '#2a2228'; ctx.fillRect(px + 1, py + 1, TS - 2, TS - 2);
      if (o['絵'] === '🕯') { drawCandleStand(px + TS / 2, py + TS / 2); flames.push([px + TS / 2, py + TS * 0.2, TS * 0.22, x * 7 + y * 13]); }
      else if (o['絵']) { ctx.font = `${TS * 0.68}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ddd'; ctx.fillText(o['絵'], px + TS / 2, py + TS / 2 + 1); }
    } else if (kind === '床' && o['絵']) {
      ctx.globalAlpha = 0.6; ctx.font = `${TS * 0.5}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o['絵'], px + TS / 2, py + TS / 2); ctx.globalAlpha = 1;
    }
    if (num(o['光'], 0) > 0) lights.push([px + TS / 2, py + TS / 2, num(o['光'], 0) * TS * (1 + Math.sin(RT.t * 9 + x * 3 + y) * 0.05 + Math.sin(RT.t * 23 + x) * 0.03)]);
  }
  // 赤い範囲（ボス技の予告）
  for (const a of RT.warns) {
    const k = 1 - a.t / a.total, L = num(a.sk['長さ'], 5) * TS, Wd = num(a.sk['幅'], 1.5) * TS;
    ctx.save(); ctx.fillStyle = `rgba(220,40,60,${0.15 + k * 0.35})`; ctx.strokeStyle = 'rgba(255,80,90,.8)';
    ctx.translate(ox + a.ox * TS, oy + a.oy * TS);
    if (a.sk['種類'] === '前') { ctx.rotate(a.ang); ctx.fillRect(0, -Wd / 2, L * k, Wd); ctx.strokeRect(0, -Wd / 2, L, Wd); }
    else if (a.sk['種類'] === '円') { ctx.beginPath(); ctx.arc(0, 0, L * k, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, L, 0, 7); ctx.stroke(); }
    else { ctx.rotate(a.ang); const sp = num(a.sk['幅'], 60) * Math.PI / 360; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, TS * 3, -sp, sp); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  // 人物は y 順に描く
  const actors = [];
  RT.enemies.forEach(e => actors.push([e.y, () => drawEnemy(e, ox, oy)]));
  if (RT.guard) actors.push([RT.guard.y, () => drawGuard(RT.guard, ox, oy)]);
  if (RT.comp && G.companion) {
    const c = charByName(G.companion) || roleChar('同行者');
    if (c) actors.push([RT.comp.y, () => drawPerson(ox + RT.comp.x * TS, oy + RT.comp.y * TS, c['服'], c['髪'], num(c['背'], 1), RT.comp.face || [0, 1])]);
  }
  const hero = roleChar('主人公') || { 服: '#aaa', 髪: '#333', 背: 1 };
  const blink = RT.inv > 0 && Math.floor(RT.t * 12) % 2;
  actors.push([G.y, () => drawPerson(ox + G.x * TS, oy + G.y * TS, hero['服'], hero['髪'], num(hero['背'], 1), G.face, blink ? 0.35 : 1)]);
  actors.sort((a, b) => a[0] - b[0]).forEach(a => a[1]());
  ctx.fillStyle = '#ffb060';
  for (const s of RT.shots) { ctx.beginPath(); ctx.arc(ox + s.x * TS, oy + s.y * TS, TS * 0.12, 0, 7); ctx.fill(); }
  // 闇と灯
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, VW, VH);
  dctx.fillStyle = 'rgba(4,2,8,0.94)'; dctx.fillRect(0, 0, VW, VH);
  dctx.globalCompositeOperation = 'destination-out';
  const flick = Math.sin(RT.t * 7) * 0.04 + Math.sin(RT.t * 13) * 0.03;
  const pr = TS * (1.4 + effLight() * 0.65) * (1 + flick);
  lights.push([ox + G.x * TS, oy + G.y * TS, pr]);
  for (const [x, y, r] of lights) {
    const gr = dctx.createRadialGradient(x, y, r * 0.15, x, y, r);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.6, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = gr; dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fill();
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
  for (const f of flames) drawFlame(...f);   // 炎は闇の上に光らせる
  for (const e of RT.enemies) drawMarks(e, ox, oy);
  // 警告と番人は闇の上にも少し見せる
  if (RT.guard) { ctx.save(); ctx.globalAlpha = 0.35; drawGuard(RT.guard, ox, oy); ctx.restore(); }
  if (RT.flash > 0) { ctx.fillStyle = `rgba(200,30,50,${RT.flash})`; ctx.fillRect(0, 0, VW, VH); }
}

/* ====================== ループ ====================== */
let last = performance.now(), lastTalking = false;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; RT.t += dt;
  const paused = !!document.querySelector('dialog[open]');
  if (S.mode === 'play' && G && !paused) {
    if (G.buff > 0) { G.buff = Math.max(0, G.buff - dt); const b = $('#buff'), txt = G.buff > 0 ? `光+${G.buffLv} ${Math.floor(G.buff / 60)}:${String(Math.floor(G.buff % 60)).padStart(2, '0')}` : ''; if (b.textContent !== txt) b.textContent = txt; }
    else if ($('#buff').textContent) $('#buff').textContent = '';
    RT.stun = Math.max(0, RT.stun - dt);
    if (!RT.busy || RT.chase) RT.grace = Math.max(0, (RT.grace || 0) - dt);
    const free = !RT.busy || RT.chase;
    if (free) { updatePlayer(dt); updateEnemies(dt); }
    if (RT.chase && S.mode === 'play') updateChase(dt);
    RT.inv = Math.max(0, RT.inv - dt); RT.flash = Math.max(0, RT.flash - dt);
    if (RT.comp) {   // 同行者は少し後ろをついてくる
      const tx = G.x - G.face[0] * 0.75, ty = G.y - G.face[1] * 0.75, dx = tx - RT.comp.x, dy = ty - RT.comp.y, d = Math.hypot(dx, dy);
      if (d > 0.15) { const k = Math.min(1, dt * 4); RT.comp.x += dx * k; RT.comp.y += dy * k; RT.comp.face = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]; RT.comp.idle = 0; }
      else if ((RT.comp.idle = (RT.comp.idle || 0) + dt) > 0.5) {   // 止まったら主人公の方を向く（顔が見える）
        const px = G.x - RT.comp.x, py = G.y - RT.comp.y;
        RT.comp.face = Math.abs(px) > Math.abs(py) * 1.5 ? [Math.sign(px), 0] : [0, 1];
      }
      if (d > 4) { RT.comp.x = tx; RT.comp.y = ty; }
    }
  }
  const talking = S.mode === 'play' && RT.busy && !RT.chase;
  if (talking !== lastTalking) { lastTalking = talking; document.body.classList.toggle('talking', talking); }
  draw();
  if (++miniTick % 6 === 0) drawMini();
  requestAnimationFrame(loop);
}

/* ====================== Markdown 読み込み UI ====================== */
function openMd() { $('#mdInfo').textContent = loadedInfo(); $('#mdDlg').showModal(); }
function loadedInfo() {
  const by = {};
  Object.values(RAW).forEach(s => (by[s.src] = by[s.src] || []).push(s.head));
  return Object.entries(by).map(([k, v]) => `${k}: ${v.length} 見出し`).join(' / ');
}
function applyUser(text, src) {
  const heads = applyText(text, src);
  if (!heads.length) { toast('## 見出しが見つかりませんでした'); return; }
  rebuild();
  toast(`${src}: ${heads.length} 見出しを反映`);
}
function rebuild() {
  W = buildWorld(); MINI = null;
  if (S.mode === 'title') { titleScreen(); return; }
  if (G && W.rooms[G.room]) {
    const rm = room();
    if (G.x > rm.w || G.y > rm.h || blocked(G.x, G.y)) enterRoom(G.room, null); else enterRoom(G.room, null, true);
  } else if (G) { enterRoom(setting('開始部屋', Object.keys(W.rooms)[0])); }
  updateHud();
}
$('#btnMd').onclick = openMd;
$('#mdClose').onclick = () => $('#mdDlg').close();
$('#mdApply').onclick = () => { const t = $('#mdText').value; if (t.trim()) { applyUser(t, '貼り付け'); $('#mdText').value = ''; $('#mdInfo').textContent = loadedInfo(); } };
$('#mdReset').onclick = () => { RAW = { ...DEFAULT_RAW }; rebuild(); toast('最初の定義に戻しました'); $('#mdInfo').textContent = loadedInfo(); };
$('#mdRestart').onclick = () => { $('#mdDlg').close(); newGame(); };
$('#mdFile').onchange = async e => { for (const f of e.target.files) applyUser(await f.text(), f.name); e.target.value = ''; $('#mdInfo').textContent = loadedInfo(); };
$('#btnInv').onclick = openInv;
$('#invClose').onclick = () => $('#invDlg').close();
addEventListener('dragover', e => { e.preventDefault(); $('#drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').style.display = 'none'; });
addEventListener('drop', async e => {
  e.preventDefault(); $('#drop').style.display = 'none';
  for (const f of e.dataTransfer.files) if (/\.(md|markdown|txt)$/i.test(f.name)) applyUser(await f.text(), f.name);
});

/* ====================== 起動 ====================== */
async function boot() {
  for (const f of FILES) {
    let text = null;
    try { const r = await fetch(f, { cache: 'no-cache' }); if (r.ok) text = await r.text(); } catch (e) {}
    if (text == null) { const el = document.querySelector(`script[type="text/markdown"][data-file="${f}"]`); if (el) text = el.textContent; }
    if (text != null) applyText(text, f, DEFAULT_RAW);
  }
  RAW = { ...DEFAULT_RAW };
  W = buildWorld();
  resize();
  titleScreen();
  requestAnimationFrame(loop);
}
boot();
</script>
